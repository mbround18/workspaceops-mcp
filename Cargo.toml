[package]
name = "workspaceops"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Standalone workspace session CLI with agent launch and auto-cleanup."
repository = "https://github.com/mbround18/workspaceops"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
ctrlc = "3"
rmcp = { version = "3.5", features = ["server", "macros", "transport-io"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "process"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "woops"
path = "src/main.rs"

[[bin]]
name = "workspaceops-mcp"
path = "src/bin/workspaceops-mcp.rs"
